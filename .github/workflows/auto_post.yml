name: JBRTCIAYUMAJAKUNING Auto Post

on:
  workflow_dispatch:

  schedule:
    # Cek RSS setiap 30 menit
    - cron: "*/30 * * * *"

jobs:
  auto-post:
    name: Posting RSS ke Telegram
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install library
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Jalankan sistem auto posting
      - name: Run JBRTCIAYUMAJAKUNING
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python jbrtciayumajakuning.py
